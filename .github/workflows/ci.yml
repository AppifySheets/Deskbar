# Builds and tests every pull request.
#
# WHY this exists separately from release.yml: a release workflow only tells you something was
# broken at the moment you tried to ship, which is far too late. This one fails on the PR that
# introduced the problem. It matters more now that the app is being shared with other people --
# nobody else can see the local test run on Petre's machine.
#
# WHY PULL REQUESTS ONLY, and not pushes to main as well. Pull requests here merge with "Rebase and
# merge", and a branch that is already on top of main is fast-forwarded: the commit that lands on
# main is the very commit this workflow tested on the pull request. A push to main then starts
# release.yml, which builds and tests that commit again before it publishes anything, so a run
# on main here would only be a third identical build.
#
# NO CHECK THAT A BRANCH IS REBASED OR BUMPS A VERSION. Both used to exist (the `rebased` and
# `bumped` jobs) because every pull request edited VersionPrefix and so conflicted with every
# merge. The version now comes from git history (version.json, see CLAUDE.md) and pull requests
# never touch it, so an out-of-date branch merges as cleanly as any other.
name: CI

on:
  pull_request:

permissions:
  contents: read

# ONE RUN PER PULL REQUEST, THE NEWEST HEAD WINS. A session keeps its open pull request on top of
# main by rebasing and pushing as soon as main moves (CLAUDE.md, "Mergeability comes before the
# pipeline"), so a branch can be pushed again while the run on its previous head is still going.
# That run tests a commit nobody will merge any more, so it is cancelled and only the run on the
# latest head finishes. Keyed on the pull request number, so different pull requests never cancel
# each other.
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # TWO RUNNERS, EACH BUILDING FOR ITSELF AND RUNNING HALF THE WINDOW TESTS. Deskbar.Windows.Tests is most
  # of the time and runs one test at a time on purpose, and splitting it across processes on ONE runner
  # broke tests (measured 2026-11-27, Deskbar task 78d5481a; the reasoning is in scripts/Test-CiShard.ps1).
  # Two runners took the run from about 3.7 to about 2.7 minutes. Public repository, so the minutes are
  # free; the cost is two of the organisation's 20 concurrent jobs per pull request instead of one.
  tests:
    name: tests (${{ matrix.shard }} of 2)
    # MUST be Windows: WPF app targeting net10.0-windows, and the tests construct real windows.
    runs-on: windows-latest
    strategy:
      # A failure in one half does not cancel the other, so one run reports every failing test.
      fail-fast: false
      matrix:
        shard: [0, 1]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # The version is the commit count since version.json changed (Nerdbank.GitVersioning),
          # and the build fails on a shallow clone. Full history.
          fetch-depth: 0

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Deskbar.sln

      - name: Build
        # -warnaserror keeps the zero-warning build honest; a warning that lands on main is a
        # warning nobody will ever go back and fix.
        run: dotnet build Deskbar.sln -c Release --no-restore -warnaserror

      - name: Test this runner's half
        # Category=Integration excluded inside the script: those tests create, switch and delete REAL
        # virtual desktops, which on a CI runner is meaningless at best and hangs the agent at worst.
        # Same filter Petre runs locally. Shard 0 also runs Deskbar.Core.Tests and every window test
        # not dealt to shard 1, so no test can fall between the halves.
        shell: pwsh
        run: ./scripts/Test-CiShard.ps1 -Shard ${{ matrix.shard }} -Of 2

  # THE ONE CHECK THAT MEANS "BUILT AND TESTED". release.yml asks GitHub whether a check run named
  # build-and-test passed on a commit before it skips its own tests, and a matrix job's check runs are
  # named per shard. So this job keeps the name and passes only when both halves passed. `!cancelled()`
  # makes it run, and fail, when a half failed, instead of being skipped (a skipped check would not read
  # as a failure). A run cancelled because a newer push superseded it is left alone.
  build-and-test:
    needs: tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Both halves passed
        run: |
          echo "tests: ${{ needs.tests.result }}"
          test "${{ needs.tests.result }}" = success
