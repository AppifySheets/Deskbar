# Builds Deskbar into a GitHub Release, and guards the moment a release is published.
#
# WHEN THIS RUNS
#   - On a merge to main that changes something under src/ (the paths filter below), so a merge
#     of docs, tests or workflows starts no runner at all. Petre: "release on merge so". The
#     version is not in a file: Nerdbank.GitVersioning computes it from version.json (the
#     major.minor line) and the git height, so a pull request never bumps anything (see
#     CLAUDE.md).
#   - Manually, via the Actions tab or `gh workflow run Release` (workflow_dispatch), from main.
#     It builds the version the checked-out commit computes, refuses a ref that is not main (its
#     version carries a -g<hash> suffix) and a version that already has a release, and always
#     stops at a draft. The draft is where signing happens: scripts/sign-release.ps1, on Petre's
#     machine, downloads the draft's executable, signs it, uploads it back and publishes.
#   - When a Release is PUBLISHED (including publishing a draft). Only the `guard` job runs:
#     it re-verifies the signature of every attached executable and turns the release back
#     into a draft if any of them fails, or if no executable is attached at all.
#   GitHub runs a `release` workflow from the file as it exists at the release's TAGGED
#   COMMIT, not from main. A release cut from a commit that has this file gets this guard; a
#   tag on a commit from before it gets whatever release.yml that commit carried, and that
#   older file does not guard anything (see the comment above the guard job).
#
# A BURST OF MERGES RELEASES ONCE, FROM ITS NEWEST COMMIT. Petre asked for releases that cost
# less CI time (2026-11-07). The jobs, in order:
#   plan     (Linux, seconds)  is there anything new to release since the last published one?
#   build    (Windows)         compile, test unless CI already tested this exact commit, publish
#                              the exe, pack the Store package
#   publish  (Linux)           create the release, with notes for EVERYTHING since the last one
#   store-smoke (Windows)      install the Store package on a fresh runner
# `plan` and `build` are each in a concurrency group that CANCELS a run already in progress when
# a newer merge arrives. `plan` is the first job, so runs join its group in push order, and a
# `build` only ever starts after its `plan`: so the build that survives a burst is always the one
# for the newest commit. Four merges inside a minute make one build, one release and one Store
# submission, where they used to make four (or, before that, lose two of them: on 2026-11-07,
# #325 shipped without its notes and #328 shipped in no release at all).
#
# Cancelling is safe because nothing is lost by it. The release notes are not taken from the one
# merged pull request but from the RANGE since the previous published release
# (scripts/ReleaseNotes.psm1): every pull request merged in that range whose commits touch src/
# contributes its "## Release notes" section. The release that survives names every pull request
# it overtook.
#
# `publish` is in a group that is NEVER cancelled, so a release is never left half made. Its runs
# are serialised, and each one checks again that no newer release already contains its commit.
#
# FULL HISTORY. Every checkout that computes the version or reads the range uses fetch-depth: 0,
# because the patch number is the count of commits since version.json changed and the range
# starts at the previous release's tag. A shallow clone makes the build fail ("Shallow clone lacks
# the objects required to calculate version height"), on purpose: a wrong version would be worse
# than no build.
#
# THE STORE PACKAGE. The build job also packs the Microsoft Store .msix of the same commit
# (scripts/pack-store.ps1) and keeps it as a workflow artifact, never a release asset; the
# store-smoke job then installs it on a fresh runner and checks it answers `deskbar version`
# as a packaged app. A failure there does not hold back the direct exe: `publish` runs as soon as
# the exe exists. Submitting that package to Partner Center is store-submit.yml's job, which
# starts when this workflow finishes.
name: Release

on:
  # A merge to main that changes the app. Whether it releases is then decided by the `plan` job,
  # over the whole range since the last release (labels, re-runs), not just this push.
  push:
    branches: [main]
    paths: ['src/**']
  workflow_dispatch:
  release:
    types: [published]

# The default GITHUB_TOKEN is read-only for contents; creating a release, uploading its asset
# and turning a bad one back into a draft all need write. pull-requests: read for the range's
# pull requests and their labels, checks: read for "did CI already test this commit". Nothing
# else is granted: least privilege, since this workflow builds code and then writes to the
# repo's releases.
permissions:
  contents: write
  pull-requests: read
  checks: read

jobs:
  # IS THERE ANYTHING TO RELEASE? On Linux and without .NET, so it costs seconds. It looks at the
  # range from the previous published release to this commit, not at this push alone:
  #   - this commit already inside a release (a re-run of a run a newer merge overtook): nothing
  #   - every change under src/ in the range labelled `no-release`: wait for the next merge, which
  #     then carries them and their notes
  #   - anything else: release
  # A failed GitHub lookup releases anyway: a release nobody wanted is one to delete, a release
  # that silently did not happen is a bug nobody sees.
  plan:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    # THE FIRST HALF OF "THE NEWEST MERGE WINS". A newer merge cancels this job if it is still
    # running, and with it the whole run. Keyed by event, so a manual run and a merge never cancel
    # each other.
    concurrency:
      group: release-plan-${{ github.event_name }}
      cancel-in-progress: true

    outputs:
      go: ${{ steps.plan.outputs.go }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # The range starts at the previous release's tag: full history, tags included.
          fetch-depth: 0

      - name: Decide whether this commit releases
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          # A manual run is an explicit request: build it. The build job still refuses a version
          # that already has a release.
          if ($env:EVENT -ne 'push') { "go=true" >> $env:GITHUB_OUTPUT; exit 0 }

          Import-Module ./scripts/ReleaseNotes.psm1
          try {
            $range = Get-ReleaseRange -Repository '${{ github.repository }}' -Head $env:SHA
          } catch {
            "::warning::Could not work out the range since the last release ($_); releasing anyway."
            "go=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          if ($range.AlreadyIn) {
            "::notice::$env:SHA is already inside $($range.Previous). Nothing new to release."
            "go=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $names = ($range.PullRequests | ForEach-Object { "#$($_.number)" }) -join ', '
          "Since $($range.Previous): pull requests $names; $($range.OrphanCommits) commit(s) with no pull request."
          if ($range.ApiFailed) {
            "::warning::A pull request lookup failed; releasing anyway."
            "go=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if (-not (Test-Releasable $range.PullRequests $range.OrphanCommits)) {
            "::notice::Every change since $($range.Previous) is labelled no-release. It ships with the next release."
            "go=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          "go=true" >> $env:GITHUB_OUTPUT

  build:
    needs: plan
    if: needs.plan.outputs.go == 'true'

    # THE SECOND HALF OF "THE NEWEST MERGE WINS": a newer merge's build cancels this one while it
    # runs. Nothing is lost, because the newer release's notes cover this commit's pull requests
    # too (see A BURST OF MERGES at the top). Nothing is half made either: this job creates no
    # release, `publish` does, in a group that is never cancelled.
    concurrency:
      group: release-build-${{ github.event_name }}
      cancel-in-progress: true

    # MUST be Windows: this is a WPF app targeting net10.0-windows, and the test suite
    # constructs real WPF windows. It cannot build or test on Linux.
    runs-on: windows-latest

    # For `publish` (which exe to attach, under which version) and store-smoke (which Store
    # package to install, and which version it must report).
    outputs:
      version: ${{ steps.version.outputs.version }}
      exe: ${{ steps.artifact.outputs.name }}
      store_package: ${{ steps.store.outputs.name }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # The version is the commit count since version.json changed: full history.
          fetch-depth: 0

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          # Matches the TargetFramework (net10.0-windows10.0.19041.0). The wildcard takes the
          # newest 10.0 patch the runner offers rather than pinning a patch that may vanish.
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Deskbar.sln

      - name: Ask MSBuild for the version
        id: version
        shell: pwsh
        run: |
          # GetBuildVersion is Nerdbank.GitVersioning's target; -getProperty prints just the
          # value. On main it is "2.4.7". On any other ref it is "2.4.7-g<hash>" (version.json
          # makes only refs/heads/main a public release), which is refused below: a tag and the
          # asset names need the plain three numbers. If a runner ever misbehaves on this query,
          # the nbgv command line is the fallback: `dotnet tool install -g nbgv --version 3.10.94`,
          # then `nbgv get-version -v Version`.
          $version = (dotnet msbuild src/Deskbar.Core/Deskbar.Core.csproj -t:GetBuildVersion -getProperty:Version -nologo | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $version) {
            "::error::MSBuild could not compute the version (exit $LASTEXITCODE). Output: $version"
            exit 1
          }
          # Case-sensitive, ASCII digits only and anchored with \A and \z: -notmatch is
          # case-insensitive, \d also matches non-ASCII digits, and $ accepts a trailing newline,
          # none of which belong in a version or a tag.
          if ($version -cnotmatch '\A[0-9]+\.[0-9]+\.[0-9]+\z') {
            "::error::The version for this ref is '$version', not three plain numbers. A -g<hash> suffix means this is not a public release ref: run the workflow from main."
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "Building version $version"

      - name: Refuse a version that already has a release, on a manual run
        # Before the build rather than at `publish`, so a manual run for a version that is already
        # out fails in seconds, not after the whole build. A merge needs no such check: `plan`
        # already stood down for a commit inside a release, and `publish` checks again.
        if: github.event_name != 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          gh release view $env:TAG --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            "::error::A release (draft or published) tagged $env:TAG already exists. Delete it first; a manual run builds the version this commit computes."
            exit 1
          }
          "No release tagged $env:TAG yet."
          # The exit is not decoration. GitHub's pwsh wrapper ends every step with
          # `exit $LASTEXITCODE`, and here the last native command is the `gh release view` above,
          # which exits 1 exactly when there is NO release: the outcome this step wants. Without
          # this line the step printed "No release tagged v2.4.15 yet." and then failed, so every
          # manual run stopped here (run 42465891436, 2026-11-08).
          exit 0

      - name: Build
        # -warnaserror: the branch builds clean today, and a release is exactly the wrong
        # moment to let a new warning slide by unnoticed.
        run: dotnet build Deskbar.sln -c Release --no-restore -warnaserror

      - name: Check the built version is the one asked for
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The query above and this build each compute the version from the same commit; this
          # proves they agree before anything is tagged. ProductVersion is the exe's
          # InformationalVersion, "2.4.7+<hash>".
          $dll = Get-ChildItem src/Deskbar.App/bin/Release -Recurse -Filter Deskbar.dll | Select-Object -First 1
          $built = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($dll.FullName).ProductVersion
          if (-not $built.StartsWith("$env:VERSION+")) {
            "::error::The build is $built but MSBuild computed $env:VERSION. Nothing is tagged."
            exit 1
          }
          "Built $built"

      - name: Did CI already test this exact commit?
        # The same suite, on the same commit, already passed on the pull request when the merge
        # fast-forwarded it (the commit that lands on main is the one CI tested). Then running it
        # again here only costs time. A rebase that made new commits has no such check, so the
        # tests run. A lookup that fails runs them too.
        id: tested
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $passed = gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?check_name=build-and-test" --jq '[.check_runs[] | select(.conclusion == "success")] | length'
          if ($LASTEXITCODE -eq 0 -and [int]"$passed" -gt 0) {
            "tested=true" >> $env:GITHUB_OUTPUT
            "CI's build-and-test already passed on ${{ github.sha }}; not running the tests again."
          } else {
            "tested=false" >> $env:GITHUB_OUTPUT
            "No passing build-and-test on ${{ github.sha }}; the tests run here."
          }
          # A failed `gh api` lookup leaves $LASTEXITCODE non-zero, and GitHub's pwsh wrapper would
          # end the step with it, failing the build instead of running the tests as the comment
          # above promises. Same trap as the manual run's release check.
          exit 0

      - name: Test
        if: steps.tested.outputs.tested != 'true'
        # Category=Integration is EXCLUDED deliberately: those tests create, switch and delete
        # REAL Windows virtual desktops. On a CI runner that is at best meaningless and at
        # worst hangs the agent. Everything else -- the whole domain, rules engine, roster,
        # placement memory, title tokens and the WPF surfaces -- does run here.
        run: dotnet test Deskbar.sln -c Release --no-build --filter "Category!=Integration" --verbosity normal

      - name: Publish a self-contained executable
        # Choices here, and why:
        #   --self-contained        the .NET runtime is bundled, so whoever downloads this
        #                           does NOT need to install anything first. That matters more
        #                           than file size for an app being handed to colleagues.
        #   PublishSingleFile       one file to download, copy and run.
        #   EnableCompressionInSingleFile  cuts the result from ~175 MB to ~74 MB. Costs a
        #                           little startup time while it decompresses.
        #   IncludeNativeLibrariesForSelfExtract  WPF drags native libraries along; without
        #                           this they would sit beside the exe instead of inside it,
        #                           which defeats the point of a single file.
        #   DebugType=none          no PDB next to a shipped binary.
        #   NOT PublishTrimmed      WPF is not trim-safe; trimming it produces an app that
        #                           builds and then fails at runtime on missing reflection
        #                           targets. Do not add it.
        run: >
          dotnet publish src/Deskbar.App/Deskbar.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o artifacts/publish

      - name: Name the executable after its version
        id: artifact
        shell: pwsh
        run: |
          # A download called "Deskbar.exe" tells nobody which build they have; one
          # called "Deskbar-2.0.0-win-x64.exe" survives being sitting in a Downloads folder.
          $name = "Deskbar-${{ steps.version.outputs.version }}-win-x64.exe"
          Move-Item artifacts/publish/Deskbar.exe "artifacts/publish/$name"
          "name=$name" >> $env:GITHUB_OUTPUT
          "{0} ({1:N1} MB)" -f $name, ((Get-Item "artifacts/publish/$name").Length / 1MB)

      - name: Keep the executable as a workflow artifact
        # How `publish` gets it, on its own runner; and something to inspect if the release step
        # fails, or the draft is deleted before anyone looked at it.
        #
        # v7, up from v4, because the v1.8.0 run reported it: "Node.js 20 is deprecated. The
        # following actions target Node.js 20 but are being forced to run on Node.js 24". Forced
        # today, refused at some point, and the failure would land on a release run -- the worst
        # moment to discover it. v7 declares node24 itself, so nothing is being forced.
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: artifacts/publish/${{ steps.artifact.outputs.name }}
          if-no-files-found: error

      - name: Pack the Store package
        # The Microsoft Store build of the same commit, beside the direct exe above: an .msix
        # for Partner Center, unsigned, because the Store signs what it receives. See
        # scripts/pack-store.ps1 and the Store packaging design
        # (docs/superpowers/specs/2026-10-24-deskbar-store-packaging-design.md).
        #
        # Its own publish, made inside pack-store.ps1 (no -PublishDir): the Store build is NOT
        # single-file, since a package installs a folder anyway and the Store scans its files,
        # so the single-file exe above cannot be reused. The script also publishes
        # deskbar-cli.exe, the target of the package's `deskbar` alias, next to it. It packs
        # with the Windows SDK's MakePri and MakeAppx from the runner image (Find-SdkTool in
        # StorePackaging.psm1 names the SDK when they are missing), and MakeAppx refusing a bad
        # manifest is this step's first check of the package.
        #
        # LAST in the job, after the exe is kept, on purpose: the package is not attached to the
        # release (store-submit.yml sends it to Partner Center), so a failure here must not hold
        # back the direct release. `publish` runs whenever the exe exists. A failure here still
        # turns the run red, and the store-smoke job below then does not run.
        id: store
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $name = "Deskbar-$env:VERSION-store.msix"
          ./scripts/pack-store.ps1 -Version $env:VERSION -Output "artifacts/store/$name"
          "name=$name" >> $env:GITHUB_OUTPUT
          "{0} ({1:N1} MB)" -f $name, ((Get-Item "artifacts/store/$name").Length / 1MB)

      - name: Keep the Store package as a workflow artifact
        # For the store-smoke job, which installs it on a fresh runner, and for store-submit.yml,
        # which finds it by this name and submits it to Partner Center. Renaming it breaks that
        # (StoreSubmission.psm1's Select-StoreCandidate). A workflow artifact only, never a release asset: the release is
        # the direct download, and an unsigned .msix there is a file nobody can install.
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.store.outputs.name }}
          path: artifacts/store/${{ steps.store.outputs.name }}
          if-no-files-found: error

  # CREATES THE RELEASE, on Linux, since it only talks to GitHub. Runs whenever `build` produced
  # an exe, even when the Store packing after it failed, and never for a build a newer merge
  # cancelled (that one's changes are in the newer release).
  publish:
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'cancelled' && needs.build.outputs.exe != '' }}
    runs-on: ubuntu-latest

    # NEVER CANCELLED, so a release is never left half made, and serialised, so two releases are
    # never created at once and "Latest" always lands on the newer one. GitHub keeps one waiting
    # run per group: a third publish can replace a second that was still waiting, which is fine,
    # because the third one's range covers the second's pull requests.
    concurrency:
      group: release-publish
      cancel-in-progress: false

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # For scripts/ReleaseNotes.psm1 and the range since the previous release's tag.
          fetch-depth: 0

      - name: Download the executable
        # v8, the current major, which reads artifacts uploaded by upload-artifact v7.
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.exe }}
          path: artifacts/publish

      - name: Create the draft release with the executable attached
        # Why a DRAFT first: the executable is unsigned at this point, and once signing is
        # enforced it stays a draft until Petre's machine signs it (scripts/sign-release.ps1),
        # because the signing certificate never leaves that machine. Drafts are invisible to the
        # app's update checker, which reads releases/latest and that endpoint skips drafts, so
        # nothing unsigned is ever announced to anyone.
        #
        # --target pins the tag, created only when the draft is published, to the exact commit
        # this run built.
        #
        # THE NOTES cover everything since the previous PUBLISHED release (scripts/ReleaseNotes.psm1):
        # each pull request merged in that range whose commits touch src/ adds its
        # "## Release notes" section, written for the people updating, and the last line names
        # every one of them. The rest of a PR description (tests, measurements, review notes) is
        # for reviewers and stays out. A range in which no PR has that section falls back to
        # --generate-notes. The notes are written to a file and passed with --notes-file, never
        # interpolated into the command.
        id: create
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.build.outputs.version }}
          ASSET: artifacts/publish/${{ needs.build.outputs.exe }}
        run: |
          $tag = "v$env:VERSION"

          # GitHub happily keeps two DRAFTS with the same tag name, and sign-release.ps1 would then
          # pick one of them, so a version that already has a release (draft or published) is
          # never created again. On a merge that is a re-run with nothing to do; a manual run
          # asked for this build specifically, so it fails.
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            if ($env:EVENT -ne 'push') {
              "::error::A release (draft or published) tagged $tag already exists. Delete it first; a manual run builds the version this commit computes."
              exit 1
            }
            "::notice::$tag already has a release. Nothing to do."
            exit 0
          }

          Import-Module ./scripts/ReleaseNotes.psm1
          $range = Get-ReleaseRange -Repository '${{ github.repository }}' -Head $env:SHA
          # A newer merge's release went out while this one was waiting, and it contains this commit.
          # Publishing this older one now would only move "Latest" backwards.
          if ($env:EVENT -eq 'push' -and $range.AlreadyIn) {
            "::notice::$env:SHA is already inside $($range.Previous). $tag is not released."
            exit 0
          }

          $notes = Join-ReleaseNotes $range.PullRequests
          if ($notes) {
            Set-Content -LiteralPath release-notes.md -Value $notes -Encoding utf8
            "Notes since $($range.Previous), from: $(($range.PullRequests | ForEach-Object { "#$($_.number)" }) -join ', ')"
            gh release create $tag --draft --target $env:SHA --title $tag --notes-file release-notes.md $env:ASSET
          } else {
            "Notes: generated, since no pull request since $($range.Previous) has a Release notes section."
            gh release create $tag --draft --target $env:SHA --title $tag --generate-notes $env:ASSET
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "created=true" >> $env:GITHUB_OUTPUT

      - name: Publish it, on a merge, while signing is not enforced
        # Petre: "release on merge so". A merge's release goes out at once, unless signing is
        # enforced (the SIGNING_CERT_THUMBPRINT variable is set): then the draft waits for
        # scripts/sign-release.ps1 on Petre's machine, exactly as a manual run's always does,
        # because the certificate never leaves that machine. A manual run always stops at the draft.
        #
        # This step does the guard's job itself, because the guard will NOT run for it: a release
        # published with the workflow's own GITHUB_TOKEN raises no `release: published` event
        # (GitHub does not start workflows from that token's events). With signing not enforced
        # the guard's only check is that an executable is attached, so that is checked here,
        # against the release as GitHub now holds it, before publishing.
        if: steps.create.outputs.created == 'true' && github.event_name == 'push' && vars.SIGNING_CERT_THUMBPRINT == ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          $exes = @(gh release view $env:TAG --json assets --jq '.assets[].name' | Where-Object { $_ -like '*.exe' })
          if ($exes.Count -eq 0) {
            "::error::$env:TAG has no executable attached, so it stays a draft."
            exit 1
          }
          # --latest is right here: publishes are serialised and an older commit stands down above
          # when a newer release already contains it, so this is the newest release there is.
          gh release edit $env:TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { "::error::Could not publish $env:TAG; it is still a draft."; exit 1 }
          "::warning::Published $env:TAG with $($exes -join ', '), unsigned: signing is not enforced (SIGNING_CERT_THUMBPRINT is not set)."

  # INSTALLS THE STORE PACKAGE ON A FRESH RUNNER AND ASKS IT WHAT IT IS. Packing proves the
  # manifest is well formed; only an install proves Windows accepts the package, gives the app
  # package identity and registers the `deskbar` alias. scripts/store-smoke.ps1 signs a copy
  # with a throwaway certificate created on the runner, trusts it machine-wide (the runner is
  # elevated, and thrown away afterwards), installs it, starts the app inside its package with
  # Invoke-CommandInDesktopPackage (so it runs with package identity; the DESKBAR_APPDATA it
  # sets does not reach the app, measured by the spike, so the app uses the runner's own
  # profile, which is thrown away with the runner), and waits up to 30 s for `deskbar version`
  # through the alias to answer "packaged": true with this build's version. Then it removes the
  # package and, if the image has the App Certification Kit, runs WACK.
  #
  # Its own job, after build rather than inside it, so the install happens on a machine that
  # did not build the app: nothing from the build's folders can stand in for a missing file in
  # the package. It does not gate the release, which `publish` makes beside it; it says whether
  # the Store package is fit to submit.
  store-smoke:
    needs: build

    # Windows, because installing an .msix is.
    runs-on: windows-latest

    # A backstop for a hung install or a stuck app. The script bounds its own waits (30 s for
    # the answer, 30 minutes for WACK), so an hour is only ever reached by something it does
    # not control, and the default six hours would be a long time to find that out.
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        # For scripts/store-smoke.ps1 and the StorePackaging.psm1 module it imports.
        uses: actions/checkout@v7

      - name: Download the Store package
        # v8, the current major, which reads artifacts uploaded by upload-artifact v7.
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.store_package }}
          path: artifacts/store

      - name: Install it, start it and ask it its version
        # The install-and-ask check FAILS the job (continue-on-error false, said out loud so
        # nobody relaxes it by accident): a package that does not install, or that runs without
        # package identity, is not one to submit. WACK's verdict, by contrast, is only reported
        # by the script as a warning, because WACK has not yet been seen to run stably on the
        # runner; a later change makes it fatal once it has.
        #
        # Windows PowerShell (shell: powershell), not pwsh: the Appx cmdlets (Add-AppxPackage,
        # Invoke-CommandInDesktopPackage, Remove-AppxPackage) are Windows PowerShell modules,
        # and PowerShell 7 loads them only
        # through a compatibility shim with a known "Operation is not supported on this
        # platform" failure. The script and its module are written for 5.1.
        continue-on-error: false
        shell: powershell
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PACKAGE: artifacts/store/${{ needs.build.outputs.store_package }}
        run: |
          ./scripts/store-smoke.ps1 -Package $env:PACKAGE -Version $env:VERSION `
            -AppData "$env:RUNNER_TEMP\deskbar-appdata" -WackReport "$env:RUNNER_TEMP\wack\wack-report.xml"

      - name: Keep the WACK report
        # Whatever WACK said, pass or not, so its verdict can be read without re-running a slow
        # kit (a WACK failure leaves the job green, so the report is where it shows).
        # always(): a report WACK already wrote is kept even when the step failed or was cut
        # off after it, by an unexpected error in the cleanup or by the job's timeout. Nothing
        # is uploaded when there is no report: the kit was not on the image, or the smoke check
        # failed and the script skipped WACK.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wack-report-${{ needs.build.outputs.version }}
          path: ${{ runner.temp }}/wack/wack-report.xml
          if-no-files-found: ignore

  # Runs when a release is published, and re-checks what was published rather than trusting
  # how it got there. It defends against:
  #   - a release published by hand, without running scripts/sign-release.ps1, so its
  #     executable is still the unsigned one the build attached;
  #   - the signing script run against the wrong certificate, so the signature is valid but
  #     is not ours;
  #   - a timestamp that never happened (the timestamp server failed or was skipped), so the
  #     signature would stop validating the day the certificate expires.
  # On any of those it turns the release back into a draft, which takes it off releases/latest
  # and so out of the update checker's sight, and fails loudly with the reasons.
  #
  # The expected certificate is named by its thumbprint in the repository VARIABLE
  # SIGNING_CERT_THUMBPRINT, not a secret: a thumbprint is public (anyone can read it off a
  # signed exe), so there is nothing to hide, and a variable shows up readably in the logs.
  #
  # While that variable is UNSET, signing is not enforced, but one check still runs: the
  # release must have at least one .exe attached. That check needs no certificate, and it
  # matters on its own: a published release with no executable becomes releases/latest, and
  # the shipped 1.x update checker reads that endpoint and would announce an update with
  # nothing to install. So with the variable unset, no .exe reverts the release to a draft and
  # fails; one or more passes with a "not enforced" warning. With the variable set, every
  # executable is held to the certificate, by design.
  #
  # If the guard itself breaks (checkout, download or module import failing) while signing
  # is enforced, its last step reverts the release anyway: it fails closed.
  #
  # What this does NOT cover: re-publishing a release whose tag sits on a commit WITHOUT this
  # guard, which is every release made before the guard existed. GitHub runs that commit's
  # own release.yml (see WHEN THIS RUNS at the top), and that older workflow rebuilds the exe
  # on publish and uploads it over the release's asset with --clobber, unsigned. Nothing here
  # sees it, and nothing reverts it. Do not re-publish such a release.
  guard:
    if: github.event_name == 'release'

    # Windows, because the check is Authenticode: Get-AuthenticodeSignature and the PKCS#7
    # parse in scripts/ReleaseSigning.psm1 are Windows APIs.
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        # For the module: the guard uses the same scripts/ReleaseSigning.psm1 as the signing
        # script, so the two cannot disagree about what "signed" means.
        uses: actions/checkout@v7

      - name: Download the release's executables
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through env rather than pasted into the script, so a tag name cannot become
          # PowerShell.
          TAG: ${{ github.event.release.tag_name }}
        run: |
          New-Item -ItemType Directory -Force assets | Out-Null
          gh release download $env:TAG --pattern '*.exe' --dir assets
          # gh fails when no asset matches. That is not this step's verdict to give: leave the
          # folder empty, and the next step reads "no executable attached", which reverts the
          # release whether or not signing is enforced. A download that failed for any other
          # reason lands in the same place, which errs on the safe side.
          if ($LASTEXITCODE -ne 0) {
            "::warning::Downloading the .exe assets of $env:TAG failed; checking an empty set."
            exit 0
          }
          Get-ChildItem assets -File | ForEach-Object { "{0} ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB) }

      - name: Verify the signatures, or turn the release back into a draft
        id: verify
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          THUMBPRINT: ${{ vars.SIGNING_CERT_THUMBPRINT }}
        run: |
          # Revert first, then report, so the release is out of the update checker's sight
          # even if someone only reads the red X and not the log. Records reverted=true only
          # when the revert worked, so the fail-closed step below knows not to repeat it and
          # does retry it when it did not.
          function Undo-Release([string[]] $reasons) {
            gh release edit $env:TAG --draft
            if ($LASTEXITCODE -ne 0) {
              "::error::Could not turn $env:TAG back into a draft. Unpublish it by hand NOW: it is live and failed the check."
            } else {
              "reverted=true" >> $env:GITHUB_OUTPUT
              "::error::$env:TAG has been turned back into a draft."
            }
            $reasons | ForEach-Object { "::error::$_" }
            exit 1
          }

          $executables = @(Get-ChildItem assets -Filter *.exe -File -ErrorAction SilentlyContinue)

          # No variable means no certificate to hold the release to yet, so signatures are not
          # checked: that lets this workflow merge, and keep releasing, before the certificate
          # exists. Setting the variable is what switches enforcement on. The one check that
          # needs no certificate still runs here: with no .exe attached the release would
          # become releases/latest and the 1.x update checker would announce an update with
          # nothing to install, so that reverts and fails. One or more passes with a warning.
          if ([string]::IsNullOrWhiteSpace($env:THUMBPRINT)) {
            if ($executables.Count -eq 0) {
              Undo-Release @('no executable attached')
            }
            "::warning::Signing is not enforced: the SIGNING_CERT_THUMBPRINT repository variable is not set, so the $($executables.Count) executable(s) of $env:TAG were not checked."
            exit 0
          }

          Import-Module ./scripts/ReleaseSigning.psm1

          $results = @($executables | ForEach-Object {
            Test-ExecutableSignature -Path $_.FullName -Thumbprint $env:THUMBPRINT
          })
          $results | Format-Table Path, Status, Signed, Valid, ThumbprintMatches, Timestamped, DigestSha256, Ok -AutoSize | Out-String -Width 300

          $verdict = Get-ReleaseVerdict -Results $results
          if ($verdict.Ok) {
            "All $($results.Count) executable(s) of $env:TAG are signed with the expected certificate and timestamped."
            exit 0
          }

          Undo-Release $verdict.Reasons

      - name: Fail closed, turning the release back into a draft
        # A checkout, download or module import failure must not leave an unsigned release
        # published. When any earlier step failed while signing is enforced, revert anyway:
        # the guard could not show the release is good, and that is enough to hold it back.
        # Skipped when the verify step already reverted the release itself, since then the
        # failure is the verdict, already reported, not the infrastructure.
        if: failure() && vars.SIGNING_CERT_THUMBPRINT != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          REVERTED: ${{ steps.verify.outputs.reverted }}
        run: |
          if ($env:REVERTED -eq 'true') {
            "The verify step already turned $env:TAG back into a draft."
            exit 0
          }
          gh release edit $env:TAG --draft
          if ($LASTEXITCODE -ne 0) {
            "::error::The guard failed for an infrastructure reason and could not turn $env:TAG back into a draft either. Unpublish it by hand NOW: it is live and unchecked."
            exit 1
          }
          "::error::The guard failed for an infrastructure reason (see the failed step above), so it could not check $env:TAG, and has turned it back into a draft. Fix the cause and publish again."
          exit 1
